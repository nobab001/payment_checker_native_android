<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PayChek — Subscription</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, "Segoe UI", sans-serif;
      background: linear-gradient(165deg, #0f172a 0%, #1e293b 45%, #0ea5e9 160%);
      color: #f8fafc; padding: 24px;
    }
    .card {
      max-width: 420px; width: 100%; background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.35); border-radius: 20px;
      padding: 28px 24px; box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { margin: 0 0 12px; line-height: 1.55; color: #cbd5e1; font-size: .95rem; }
    .ok { color: #34d399; font-weight: 600; }
    .cancel { color: #fbbf24; font-weight: 600; }
    .err { color: #f87171; font-weight: 600; }
    .meta { font-size: .8rem; color: #94a3b8; word-break: break-all; }
    a.btn {
      display: inline-block; margin-top: 8px; padding: 10px 16px;
      background: #0ea5e9; color: #fff; text-decoration: none; border-radius: 10px;
      font-weight: 600; font-size: .9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">পেমেন্ট</h1>
    <p id="msg">অ্যাপে ফিরে যান।</p>
    <p class="meta" id="meta"></p>
    <p id="action"></p>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const status = (q.get('status') || '').toLowerCase();
    const orderId = q.get('orderId') || '';
    const reason = q.get('reason') || q.get('error') || q.get('message') || '';
    const title = document.getElementById('title');
    const msg = document.getElementById('msg');
    const meta = document.getElementById('meta');
    const action = document.getElementById('action');

    if (status === 'success') {
      title.textContent = 'পেমেন্ট সফল';
      title.className = 'ok';
      msg.textContent = 'অ্যাপে ফিরে যাচ্ছি…';
      const deep = 'paychek://billing/success?status=success'
        + (orderId ? ('&orderId=' + encodeURIComponent(orderId)) : '');
      action.innerHTML = '<a class="btn" href="' + deep + '">অ্যাপ খুলুন (Home)</a>';
      // Auto-open app Home
      setTimeout(function () { location.href = deep; }, 400);
    } else if (status === 'cancel') {
      title.textContent = 'পেমেন্ট বাতিল / ব্যর্থ';
      title.className = 'cancel';
      msg.textContent = reason
        ? ('কারণ: ' + reason)
        : 'পেমেন্ট সম্পন্ন হয়নি। চেকআউট পেজে ফিরে আবার চেষ্টা করুন, অথবা অ্যাপে ফিরে Buy আবার চাপুন।';
    } else if (status === 'failed' || status === 'error') {
      title.textContent = 'পেমেন্ট ব্যর্থ';
      title.className = 'err';
      msg.textContent = reason || 'পেমেন্ট ভেরিফাই হয়নি। ট্রানজেকশন আইডি ও অ্যামাউন্ট মিলিয়ে আবার চেষ্টা করুন।';
    }
    if (orderId) meta.textContent = 'Order: ' + orderId;
  </script>
</body>
</html>
